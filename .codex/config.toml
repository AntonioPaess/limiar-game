# LIMIAR — MCPs para Codex (espelho de .mcp.json; manter os dois em sincronia).
# Codex lê config de projeto apenas em projetos marcados como confiáveis; senão copie para ~/.codex/config.toml.

[mcp_servers.godot]
command = "npx"
args = ["-y", "@npgamedev/godot-mcp-server@1.1.2"]

[mcp_servers.blender]
command = "uvx"
args = ["mcp-for-blender==2.2.8"]
env = { BLENDER_MCP_DISABLE_TELEMETRY = "1", DISABLE_TELEMETRY = "true" }
